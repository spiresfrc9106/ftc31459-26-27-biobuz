distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Pinned to 8.14.3 (NOT the SDK's 9.1.0) because Sloth's Load plugin calls
# Project.exec, which Gradle 9.0 removed. Sloth wires removeSlothRemote into
# installDebug, so on Gradle 9 this module cannot install at all -- while
# assembleDebug still succeeds, which makes it a confusing failure.
# 8.14.3 is the last Gradle 8.x and satisfies AGP 8.13.2.
# Revisit when Sloth ships its ExecOperations fix (Dairy-Foundation/Sloth #11).
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
